name: Verbal Check
description: The short spoken check on a challenge, done in lab with the instructor.
title: "Challenge 4 Verbal Check"
body:
  - type: markdown
    attributes:
      value: |
        Filled in by the instructor or a technical leader during lab. The student
        answers two or three questions about their own code in the context of the
        assignment at hand. This is a check on understanding, not a presentation.

        Challenge 4 asked for two functions in `src/clue.py`: `exactly_one`, which
        says the case file holds one card of a kind, and `encode_turn`, which turns
        one turn of the game into a sentence. Every line below is about one of
        those two. Questions for each line, with what to listen for:
        https://areweagentsyet.com/tl/verbal-checks-challenge-04/
  - type: input
    attributes:
      label: Student
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Understanding
      description: Tick each line the student explained correctly, in their own words. Two or three questions is enough; no line needs their code open or a remembered number.
      options:
        - label: "The rule they wrote. What each half of `exactly_one` says (at least one; no two together), and what deleting either half would do."
        - label: "The turn they encoded. Why a card you hold or are shown becomes NOT that card, and why a suggestion answered out of sight is an OR and not an AND."
        - label: "A deduction. How a card gets settled by elimination or by an earlier suggestion, and what YES, NO and MAYBE mean about the possible case files."
        - label: "Predicting a change. What a different turn order, one more card, or a new kind of turn would do to what is known or to the number of possible worlds."
  - type: dropdown
    attributes:
      label: Outcome
      options:
        - "Passed: explained their own work clearly"
        - "Passed with gaps: correct code, shaky explanation"
        - "Not yet: could not provide clear answers, can redo with a token use"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Notes
      description: What to follow up on, and anything worth remembering for the next challenge.
