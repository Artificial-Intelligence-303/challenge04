[project]
name = "challenge-04-clue"
version = "1.0.0"
description = "CMPSC 303 Challenge 4: a game of Clue as a propositional knowledge base."
requires-python = ">=3.11"
dependencies = [
    "gatorgrade",
    "mypy>=1.11",
    "pytest",
    "pytest-timeout",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Every test here finishes in a few seconds at most. model_check tries every
# one of 4,096 models, so a slow test is expected; a stuck one is not.
timeout = 10

[tool.mypy]
ignore_missing_imports = true
mypy_path = "src"

# Style is checked against the Google Python Style Guide:
# https://google.github.io/styleguide/pyguide.html
[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors, includes line length
    "W",   # pycodestyle warnings, includes trailing whitespace
    "F",   # pyflakes, unused imports and names
    "I",   # import ordering
    "D",   # docstring conventions
    "N",   # naming conventions
]
ignore = [
    "D203",  # conflicts with D211, which ruff prefers
    "D213",  # conflicts with D212, which matches the Google convention
]

[tool.ruff.lint.pydocstyle]
convention = "google"
